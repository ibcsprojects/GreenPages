name: Idea or feature request
description: Suggest something SparePage could catch or do
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like SparePage to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it save paper or ink?
      description: A short example helps.
